name: NamPay verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nampay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
      NAMPAY_EMULATOR_TOOLS: ${{ runner.temp }}/nampay-firebase-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked application dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix frontend ci --legacy-peer-deps --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Dependency security threshold
        run: |
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Backend and frontend tests
        run: |
          npm --prefix backend test -- --runInBand --ci
          npm --prefix frontend test -- --ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Install pinned Firebase CLI
        run: bash scripts/install-emulators.sh

      - name: Real Firebase rules, concurrency and server startup
        run: bash scripts/emulators.sh exec 'node scripts/emulator-smoke.cjs && node scripts/emulator-payment-smoke.cjs && node scripts/emulator-server-smoke.cjs'

      - name: Compile web and native bundles with placeholder API
        env:
          EXPO_PUBLIC_API_URL: https://demo-api.example.invalid
        run: npm --prefix frontend run build:bundles

      - name: Install Playwright Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          printf 'NAMPAY_CHROMIUM=%s\n' "$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Browser journeys and reliability
        env:
          NAMPAY_WEB_ORIGIN: http://localhost:8081
          NAMPAY_SMOKE_API: http://localhost:3000
        run: bash scripts/ci-browser.sh

      - name: Keep synthetic browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: docs/design/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
